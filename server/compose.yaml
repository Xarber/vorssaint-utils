services:
  relay:
    build: .
    env_file:
      - path: /srv/xcenter/secrets/vorssaint/relay.env
        required: false
    ports:
      - 127.0.0.1:8789:8789
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8789/auth/xcenter/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3
