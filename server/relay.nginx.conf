# Include only in the TLS server for vorssaint.xcenter.it.
location ^~ /auth/xcenter/ {
    access_log off;
    client_max_body_size 9m;
    proxy_pass http://127.0.0.1:8789;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header Host vorssaint.xcenter.it;
    proxy_connect_timeout 3s;
    proxy_read_timeout 90s;
}
