[package]
name = "vorssaint-localsend"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
localsend = { path = "upstream/packages/core", features = ["discovery"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
